[project]
name = "holdup"
version = "0.1.0"
description = "Scam brakes for stablecoin payments on NEAR: new payees wait in a keyless vault, and the AI can only add time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "near-kit==1.3.0",
    "python-telegram-bot==22.8",
    "openai==3.42.0",
    "mcp==2.3.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "jinja2==3.1.6",
    "cryptography==50.0.2",
    "base58==2.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "hypothesis==6.170.14",
    "respx==0.23.1",
]

[project.scripts]
holdup = "holdup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holdup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "sandbox: needs a running NEAR sandbox (NEAR_SANDBOX_URL)",
    "testnet: talks to NEAR testnet (HOLDUP_TESTNET=1)",
    "live_otari: calls the hosted Otari gateway (OTARI_API_KEY)",
]
addopts = "-m 'not sandbox and not testnet and not live_otari'"
