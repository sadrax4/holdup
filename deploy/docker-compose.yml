# HoldUp on one server: the app behind Caddy, which terminates HTTPS for two hostnames.
#
#   cd ~/work/holdup/deploy && docker compose up -d --build
#
# All settings live in ~/work/secrets/holdup.env, outside the repository:
#   - the holdup service reads the whole file (env_file below);
#   - Compose reads the same file through deploy/.env, a symlink that setup-ubuntu.sh creates,
#     to fill in ${HOLDUP_HOST}, ${FIXTURE_HOST} and ${ACME_EMAIL}. Caddy receives only those.
# See deploy/README.md.

name: holdup

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  holdup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: holdup:local
    restart: unless-stopped
    init: true
    env_file:
      - ../../secrets/holdup.env
    environment:
      # Derived from the host names Caddy serves, so links, the MCP URL and the guardrail URL
      # handed to Otari always match the certificates. These override holdup.env.
      PUBLIC_BASE_URL: "https://${HOLDUP_HOST:?set HOLDUP_HOST in ~/work/secrets/holdup.env (see deploy/README.md)}"
      # Base URL for links to the /fixtures/ training pages, which only FIXTURE_HOST serves.
      FIXTURE_BASE_URL: "https://${FIXTURE_HOST:?set FIXTURE_HOST in ~/work/secrets/holdup.env (see deploy/README.md)}"
      # Port 8000 is reachable only from Caddy on the internal network, so uvicorn can trust
      # the X-Forwarded-For and X-Forwarded-Proto headers Caddy sets.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - holdup-data:/data
    # Not published on the host: Docker's published ports bypass ufw, and only Caddy needs it.
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 30s
    logging: *logging

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      - holdup
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HOLDUP_HOST: "${HOLDUP_HOST:?set HOLDUP_HOST in ~/work/secrets/holdup.env (see deploy/README.md)}"
      FIXTURE_HOST: "${FIXTURE_HOST:?set FIXTURE_HOST in ~/work/secrets/holdup.env (see deploy/README.md)}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in ~/work/secrets/holdup.env (see deploy/README.md)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Keep this volume: losing it means new
      # certificates, and Let's Encrypt rate limits apply.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  holdup-data:
    name: holdup-data
  caddy-data:
    name: holdup-caddy-data
  caddy-config:
    name: holdup-caddy-config
