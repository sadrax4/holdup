[workspace]
resolver = "2"
members = ["holdvault", "demo-token"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/holdup-near/holdup"

[workspace.dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
