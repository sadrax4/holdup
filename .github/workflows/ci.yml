name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Actions are pinned to full commit SHAs; the comment names the release each SHA belongs to.
jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # The uv that wrote uv.lock; the server job checks the lock with the server's uv too.
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked also fails the job when uv.lock no longer matches pyproject.toml.
      - name: Install dependencies from uv.lock
        run: uv sync --locked

      # tests/test_server_runner.py runs scripts/server.sh end to end in tmux; without it they are skipped.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends tmux

      - name: Run pytest
        run: uv run --locked pytest -q

  rust:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the toolchain pinned in contracts/rust-toolchain.toml
        id: toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          path = pathlib.Path("contracts/rust-toolchain.toml")
          spec = tomllib.loads(path.read_text()).get("toolchain", {}) if path.exists() else {}
          print("channel=" + spec.get("channel", "stable"))
          print("targets=" + ",".join(sorted(set(spec.get("targets", [])) | {"wasm32-unknown-unknown"})))
          print("components=" + ",".join(spec.get("components", [])))
          PY

      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (tag v1)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ steps.toolchain.outputs.targets }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts -> target

      - name: Run cargo test
        working-directory: contracts
        run: cargo test --locked --workspace

      - name: Build the wasm files and check them against nearcore's rules
        run: bash scripts/build_contracts.sh --plain

  server:
    name: Server scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv 0.12.9, the version on the server HoldUp runs on
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.9"

      # Read-only: fails when that uv would not accept uv.lock as it is (server.sh runs uv sync --locked).
      - name: Check uv.lock with the server's uv
        run: uv lock --check

      - name: Check the syntax of the server scripts
        run: |
          for script in scripts/server.sh scripts/testnet.sh deploy/backup.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/server_tools.py
